name: check
on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [latest, nightly]
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - uses: moonbit-community/setup-moonbit@main
        with:
          version: ${{ matrix.toolchain }}
      - name: Install Qt and C++23 dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-18 cmake make qt6-base-dev pkg-config
      - run: moon version --all
      - name: Native build, regression tests, and sanitizers
        run: bash scripts/check-native.sh

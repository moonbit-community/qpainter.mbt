name: check

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  check-native:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: moonbit-community/setup-moonbit@main
        with:
          version: stable

      - name: moon version
        run: moon version --all

      - name: install dependencies
        run: |
          moon update
          moon install

      - name: moon check (native)
        run: moon check --target native --deny-warn --package-path src/qpainter

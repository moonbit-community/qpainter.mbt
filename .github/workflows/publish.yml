name: publish-package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - uses: moonbit-community/setup-moonbit@main
        with:
          version: latest
      - name: Install Qt and C++23 dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-18 cmake make qt6-base-dev pkg-config
      - name: Validate native release
        run: bash scripts/check-native.sh
      - name: Publish
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_MOONBIT_COMMUNITY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$MOONCAKES_TOKEN"
          trap 'rm -f "$HOME/.moon/credentials.json"' EXIT
          printf '%s' "$MOONCAKES_TOKEN" > "$HOME/.moon/credentials.json"
          moon publish --dry-run
          moon publish
